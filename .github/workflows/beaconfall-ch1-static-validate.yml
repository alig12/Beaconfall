name: Beaconfall Chapter 1 Static Validate

on:
  push:
    branches:
      - feature/auto-pr-2026-03-28
  pull_request:
    paths:
      - 'data/maps/**'
      - 'data/scripts/**'
      - 'dev_scripts/**'
      - 'docs/**'
      - 'src/data/wild_encounters.json'
      - 'src/data/region_map/region_map_sections.json'
      - 'verify_ch1_pass.py'
      - 'Makefile'
      - '.github/workflows/beaconfall-ch1-static-validate.yml'

jobs:
  static-validate:
    name: Static validate Chapter 1
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Beaconfall Chapter 1 validator
        run: python3 dev_scripts/beaconfall_ch1_validate.py

      - name: Run Chapter 1 pass verifier
        run: python3 verify_ch1_pass.py
